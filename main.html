<!DOCTYPE html>
<html lang="en">
<head>

    <title>HTML Assignment 3</title>

    <style>
        table.middle {

            border: 1px solid black;
            border-spacing: 1px;

        td {
            border: 1px solid black;
            padding: 1px;
        }

        .center {

        }

        .right {

        }

        .green {

        .blue {

</head>
